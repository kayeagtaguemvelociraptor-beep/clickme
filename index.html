<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>I Love You Ate Lai</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
  }

  h1 {
    font-size: 3em;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  }

  p {
    font-size: 1.3em;
  }

  button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    background: #ff4d6d;
    color: white;
    font-size: 1em;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  button:hover {
    background: #ff1e4d;
  }

  /* HEARTS */
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(45deg);
    animation: floatUp 6s linear infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
  }

  .heart::before { top: -10px; left: 0; }
  .heart::after { left: -10px; top: 0; }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(45deg); opacity: 1; }
    100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
  }

  /* POPUP */
  .popup {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .popup-content {
    background: white;
    color: #333;
    padding: 30px;
    border-radius: 15px;
    width: 80%;
    max-width: 400px;
    text-align: center;
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .close {
    margin-top: 15px;
    background: #ff4d6d;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div>
  <h1>💖 I Love You Ate Lai 💖</h1>
  <p>You are my favorite person in the world ❤️</p>
  <button onclick="openSurprise()">Click for Surprise 🎁</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>💌 Surprise Message</h2>
    <p>
      Ate Lai,<br><br>
      I just want to say that you are deeply appreciated and loved.  
      No matter what happens, you will always have a special place in my heart. 💖
      <br><br>
      I love you so much 💕
    </p>
    <button class="close" onclick="closeSurprise()">Close</button>
  </div>
</div>

<script>
function openSurprise() {
  document.getElementById("popup").style.display = "flex";
}

function closeSurprise() {
  document.getElementById("popup").style.display = "none";
}

// floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");

  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.animationDuration = (3 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 200);
</script>

</body>
</html>
